<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bradesco | Guardian</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
    <div class="topbar">
        <div class="title">
            <h1>bradesco</h1>
            <span class="partner">| Guardian</span>
        </div>
        <span class="data" id="today-data"></span>
        <label class="search">
            <input type="search" placeholder="Buscar" aria-label="Buscar">
            <svg class="icon" viewBox="-2.5 -2.5 24 24" aria-hidden="true">
                <path
                    d="M8 14A6 6 0 1 0 8 2a6 6 0 0 0 0 12zm6.32-1.094l3.58 3.58a1 1 0 1 1-1.415 1.413l-3.58-3.58a8 8 0 1 1 1.414-1.414z" />
            </svg>
        </label>
        <div class="balance">
            <button type="button" class="balance-button" onclick="changeBalance()">
                <span class="available-balance">Saldo disponível ▾</span>
                <span class="balance-amount" id="balance-amount">R$ ••••••</span>
            </button>

            <div class="user">
                <span>|</span>
                <span class="name">EMÍLIO</span>
                <button type="button" class="exit">
                    Sair
                    <svg class="icon icon-line" viewBox="0 0 24 24" aria-hidden="true">
                        <polyline points="18 9 21 12 18 15"></polyline>
                        <line x1="21" y1="12" x2="7" y2="12"></line>
                        <path d="M14,16v3a1,1,0,0,1-1,1H4a1,1,0,0,1-1-1V5A1,1,0,0,1,4,4h9a1,1,0,0,1,1,1V8"></path>
                    </svg>
                </button>
            </div>
        </div>

    </div>
    <header class="button-navbar">
        <nav class="navbar">
            <a href="index.html" class="active">Início</a>
            <a href="">Saldos e Extratos</a>
            <a href="">Pagamentos</a>
            <a href="src/pages/pix.html">Pix</a>
            <a href="">Transferências</a>
            <a href="">Cartões</a>
            <a href="src/pages/guardian.html">Guardian <span class="new">Novo</span></a>
            <a href="">Mais opções ▾</a>
        </nav>
    </header>

    <footer>
        <div class="title">
            <h1>bradesco</h1>
        </div>
    </footer>

    <script src="src/script/main.js"></script>
